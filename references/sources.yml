# Source registry for the COLDCARD entropy failure research.
#
# authority_level scale (highest to lowest):
#   1 = source code / commit / raw blockchain data (independently reproducible by anyone)
#   2 = official vendor advisory / documentation
#   3 = independent technical analysis by a named, credentialed org (e.g. Block)
#   4 = independent on-chain / journalistic investigation with shown methodology
#   5 = general tech press
#   6 = social media / forum, anecdotal only
#
# claims_supported values reference §4 of the working brief:
#   root-cause, entropy-estimate, affected-versions, onchain-sweep, mitigations,
#   timeline, cve-status, legal, community-context

- id: firmware-repo
  title: "Coldcard/firmware (git repository)"
  author_or_org: "Coinkite Inc."
  url: "https://github.com/Coldcard/firmware"
  publication_date: "ongoing"
  accessed_at: "2026-07-31"
  source_type: "source-code"
  authority_level: 1
  claims_supported: [root-cause, affected-versions, timeline]
  archived_url: ""
  notes: >
    Cloned locally (--filter=blob:none) and inspected directly with git log/show/tag/
    ls-tree/merge-base. See evidence/commits/findings.md for everything derived from
    this source. 182 tags at access time. Default branch: master. Relevant branches
    found beyond master: v4, v4-legacy, edge, new_edge, mk4, q1staging, pr-rng-fix.

- id: micropython-coldcard-fork
  title: "Coldcard/micropython (git repository, Coinkite fork of MicroPython)"
  author_or_org: "Coinkite Inc. / MicroPython contributors"
  url: "https://github.com/Coldcard/micropython"
  publication_date: "ongoing"
  accessed_at: "2026-07-31"
  source_type: "source-code"
  authority_level: 1
  claims_supported: [root-cause]
  archived_url: ""
  notes: >
    IMPORTANT CORRECTION to the working brief: the brief pointed at
    micropython/micropython (upstream). COLDCARD actually pins its own fork,
    Coldcard/micropython, as the external/micropython submodule. ports/stm32/rng.c in
    THIS fork (not upstream) is what was inspected. Upstream micropython/micropython
    was not analyzed and any claim about it should be treated as unverified.

