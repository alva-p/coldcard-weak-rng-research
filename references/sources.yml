    States Mk3 affected range as 4.0.1-4.1.9 (not 4.0.0). Code analysis
    (evidence/commits/findings.md) shows the regression commit b18723dd first shipped
    IN v4.0.0 (2021-03-17). This is a real advisory-vs-code discrepancy, not resolved
    by assumption - see RESEARCH_GAPS.md item G-2. Fetched via automated page-content
    extraction, not manually re-read line by line; treat fine-grained quotes as
    PRELIMINARY pending manual re-check.

- id: coinkite-entropy-backgrounder
  title: "Technical Deep Dive into the Entropy Issue"
  author_or_org: "Coinkite Inc."
  url: "https://blog.coinkite.com/entropy-technical-backgrounder/"
  publication_date: "2026-07-30 (updated 2026-07-31 12:39 EDT)"
  accessed_at: "2026-07-31"
  source_type: "vendor-technical-analysis"
  authority_level: 2
  claims_supported: [root-cause, entropy-estimate]
  archived_url: ""
  notes: >
    Describes the #ifndef-vs-nonzero MICROPY_HW_ENABLE_RNG guard bug. This description
    matches, almost verbatim, what was independently confirmed by direct source
    inspection of ngu/random.c (see evidence/commits/findings.md §6) - upgraded from
    PRELIMINARY to CONFIRMED on that specific point. Gives ~40 bits (Mk3) / ~72 bits
    (Mk4/Q/Mk5); per the extraction performed, this document does not itself discuss
    the 32-bit reseed truncation (that is documented directly in source - see
    findings.md §5 - and discussed by the Block report, id: block-engineering-report).

- id: block-engineering-report
  title: "Predictable RNG Fallback and 32-Bit Reseed in COLDCARD Firmware"
  author_or_org: "Block Inc. (Block Bitcoin Engineering and Security)"
  url: "https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware"
  publication_date: "2026-07-30"
  accessed_at: "2026-07-31"
  source_type: "independent-technical-analysis"
  authority_level: 3
  claims_supported: [entropy-estimate, root-cause, timeline]
  archived_url: ""
  notes: >
    Self-describes as published before completing empirical/benchmark exploitation
    testing, due to indications of active exploitation - treat its entropy figures
    (~2^16.29, ~2^40.7, <=2^32, ~2^73.3) as PRELIMINARY model outputs, not measured
    costs. Lists paper wallets, Seed XOR, cloning/USB ECDH, Key Teleport, Web2FA,
    Secure Notes/HSM as other ngu.random consumers worth separate risk analysis.

- id: atlas21-onchain
  title: "594 bitcoin drained in fifteen minutes: what we know so far"
  author_or_org: "Atlas21 (author: Federico Rivi)"
  url: "https://atlas21.com/594-bitcoin-drained-15-minutes-theft/"
  publication_date: "2026-07-30"
  accessed_at: "2026-07-31"
  source_type: "independent-onchain-investigation"
  authority_level: 4
  claims_supported: [onchain-sweep]
  archived_url: ""
  notes: >
    Primary numbers used as the external benchmark for tools/onchain reconstruction:
    500 addresses, 500 tx, 1324 UTXO, 594.5 BTC, ~0.044 BTC fees, blocks 960188-960191,
    01:36-01:51 UTC, consolidation address bc1qq85v2c926eg6pgxhwp6q7lf6cnsz80qs3fcu9r,
    562 BTC consolidated. Additional detail beyond the working brief: reports 490/500
    swept addresses as native segwit, 5 legacy, 5 nested segwit; states no multisig
    among the 1324 UTXO and no Taproot address among victims. Treat all of the above as
    PRELIMINARY (independent journalism with shown on-chain method, not yet
    independently re-derived by this repo's own tooling) until tools/onchain/
    reproduces or contradicts it - see evidence/onchain/validation-report.md (Phase 2).

